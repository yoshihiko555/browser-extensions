<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 340px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      color: #222;
    }
    section {
      padding: 10px 12px;
      border-bottom: 1px solid #e0e0e0;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 4px;
    }
    .muted {
      color: #666;
      font-size: 12px;
    }
    .summary {
      font-weight: 600;
      margin-bottom: 6px;
    }
    ul {
      margin: 0;
      padding-left: 18px;
      max-height: 180px;
      overflow-y: auto;
      font-size: 12px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    button {
      padding: 5px 10px;
      font-size: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
    }
    button:hover:not(:disabled) {
      background: #f5f5f5;
    }
    button.primary {
      background: #4CAF50;
      color: #fff;
      border-color: #4CAF50;
    }
    button.primary:hover:not(:disabled) {
      background: #43a047;
    }
    button:disabled {
      opacity: 0.45;
      cursor: default;
    }
    #status {
      min-height: 1.2em;
    }
    #status.error {
      color: #d93025;
    }
  </style>
</head>
<body>
  <section>
    <h1>Bookmark Sorter</h1>
    <div class="muted" id="source">履歴を集計中…</div>
  </section>
  <section>
    <div class="summary" id="summary"></div>
    <ul id="folders"></ul>
  </section>
  <section>
    <div class="actions">
      <button class="primary" id="sort" disabled>並び替える</button>
      <button id="undoLast" disabled>直前に戻す</button>
      <button id="undoOriginal" disabled>初回の前に戻す</button>
      <button id="openStructure">構成を反映…</button>
    </div>
    <p class="muted">「直前に戻す」は最後の 1 回分だけ。「初回の前に戻す」は最初に並び替える前の並びに戻します。</p>    <div id="status"></div>
  </section>
  <script type="module" src="popup.js"></script>
</body>
</html>
